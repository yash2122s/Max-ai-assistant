name: LG TV debug APK
on:
  push:
    branches: [feature/lg-tv-remote]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1'
      - name: Restore persistent debug signer
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MAX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Tests only. Configure MAX_DEBUG_KEYSTORE_B64 to publish an installable update."
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: bash gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --console=plain
      - name: Verify APK
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MAX-lg-tv-debug.apk
          sha256sum MAX-lg-tv-debug.apk >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: MAX-lg-tv-debug.apk
      - name: Run share reminder tests
        run: bash gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --tests 'com.example.smarthome.*' --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test local UDP wake packet delivery on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.smarthome.TvNetworkTest --console=plain
