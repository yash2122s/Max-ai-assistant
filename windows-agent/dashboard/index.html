<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Agent Operations Console</title>
    <!-- Themes stylesheet (will be programmatically replaced or dynamic variable bound) -->
    <link id="theme-link" rel="stylesheet" href="/assets/css/themes/dark.css">
    <!-- Central components & layouts -->
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/qrcode.min.js"></script>
</head>
<body>


    <!-- Notification Toast Deck -->
    <div id="notifications-container"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="brand-accent">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span>MAX <span class="brand-accent">CONSOLE</span></span>
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item" data-page="dashboard">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="menu-item" data-page="activity">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <span>Activity</span>
                </a>
            </li>
            <li class="menu-item" data-page="terminal">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    <span>Terminal</span>
                </a>
            </li>
            <li class="menu-item" data-page="logs">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Logs</span>
                </a>
            </li>
            <li class="menu-item" data-page="devices">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                    <span>Devices</span>
                </a>
            </li>
            <li class="menu-item" data-page="tools">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                    <span>Tools</span>
                </a>
            </li>
            <li class="menu-item" data-page="settings">
                <a class="menu-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
        
        <div class="sidebar-footer">
            <div>Agent v3.0.0 Full GA</div>
            <div>13 tools · 80+ actions</div>
        </div>
    </aside>

    <!-- Content Workspace -->
    <main id="main-wrapper">
        <header id="topbar">
            <div class="topbar-left">
                <span id="header-view-title" class="view-title">Dashboard</span>
                <span id="connection-status-badge" class="status-badge disconnected">Disconnected</span>
            </div>
            
            <div class="topbar-right">
                <!-- Developer Mode Toggle Switch -->
                <label class="switch-group" title="Unlocks raw heartbeat, protocol pings, and socket logging levels">
                    <input type="checkbox" id="dev-mode-toggle" class="switch-checkbox">
                    <span>Developer Mode</span>
                </label>
                
                <!-- Theme Selection Dropdown -->
                <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <label for="theme-selector" class="form-label" style="margin: 0; white-space: nowrap;">Theme</label>
                    <select id="theme-selector" class="form-input" style="width: auto; padding: 4px 8px; font-size: 12px; margin: 0;">
                        <option value="dark">Dark Theme</option>
                        <option value="light">Light Theme</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Dynamic Frame Node -->
        <section id="content-frame"></section>
    </main>

    <!-- Main Module Orchestrator -->
    <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
